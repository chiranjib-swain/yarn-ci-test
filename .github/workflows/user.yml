name: testing_1477_oidc
on:
  workflow_dispatch:


permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # environment: release
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
  

    - name: Enable Yarn 4
      run: |
        corepack enable
        corepack prepare yarn@4.1.1 --activate
        yarn --version

    - name: Use Node.js 24
      uses: Satishchoudhary94/setup-node@fix/oidc-support-1440
      # uses: actions/setup-node@v5
      with:
        node-version: "24"
        registry-url: "https://registry.npmjs.org"
        cache: yarn
    
    - name: Install dependencies
      run: yarn install --immutable

    - name: Build
      run: yarn build

    # - name: Publish
    #   run: npm publish --provenance
    
    - name: Publish
      run: yarn npm publish --access public --provenance
      env:
        NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # Required for npm publish, but not for authentication with OIDC
    #     # NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # Required for npm publish, but not for authentication with OIDC